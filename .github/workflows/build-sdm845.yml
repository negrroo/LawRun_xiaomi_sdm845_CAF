name: Build sdm845 kernel
on:
  push:
    branches: [stable-4.9.337]
    paths: ['.github/workflows/build-sdm845.yml']
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: KernelSU (repo symlinks to his local path /home/negrroo/Kernel/KernelSU)
        run: |
          sudo mkdir -p /home/negrroo/Kernel
          sudo git clone --depth 1 -b next https://github.com/negrroo/KernelSU-Next /home/negrroo/Kernel/KernelSU
          ls /home/negrroo/Kernel/KernelSU/kernel | head -5
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev zip python3 ccache
      - name: Build
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=negrroo KBUILD_BUILD_HOST=lawrun
          make O=out LawRun_defconfig
          scripts/config --file out/.config -d CC_WERROR
          yes '' | make O=out oldconfig
          make O=out -j$(nproc) KCFLAGS='-w -Wno-error' Image.gz-dtb 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
          ls -la out/arch/arm64/boot/
      - name: Package AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cp out/arch/arm64/boot/Image.gz-dtb ak3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz ak3/
          cd ak3 && zip -r9 ../LawRun_sdm845_test.zip . -x '.git*' README.md
      - uses: actions/upload-artifact@v4
        with:
          name: LawRun-sdm845-test
          path: |
            LawRun_*_test.zip
            build.log
# trigger
