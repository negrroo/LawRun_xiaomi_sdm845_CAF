name: Build sdm845 kernel
on:
  push:
    branches: [stable-4.9.337]
    paths: ['.github/workflows/build-sdm845.yml']
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: KernelSU (repo symlinks to his local path /home/negrroo/Kernel/KernelSU)
        run: |
          sudo mkdir -p /home/negrroo/Kernel
          sudo git clone --depth 1 -b next https://github.com/negrroo/KernelSU-Next /home/negrroo/Kernel/KernelSU
          ls /home/negrroo/Kernel/KernelSU/kernel | head -5
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev zip python3 ccache
      - name: Build
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=negrroo KBUILD_BUILD_HOST=lawrun
          make O=out LawRun_defconfig
          scripts/config --file out/.config -d CC_WERROR
          yes '' | make O=out oldconfig
          make O=out -j$(nproc) KCFLAGS='-w -Wno-error' Image.gz-dtb 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
          ls -la out/arch/arm64/boot/
      - name: Package with LawRun installer (22.0 Riyadh template from his Pling store)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          d = json.load(urllib.request.urlopen("https://api.kde-look.org/ocs/v1/content/data/2031080?format=json"))["data"][0]
          for i in range(1, 80):
              if d.get("downloadname%d" % i) == "LawRun-845-22.0-Riyadh-A09A15.zip":
                  open("template_url.txt", "w").write(d["downloadlink%d" % i]); break
          PY
          curl -sL -o template.zip "$(cat template_url.txt)"
          mkdir pkg && cd pkg && unzip -q ../template.zip
          cp ../out/arch/arm64/boot/Image.gz LawRun-Kernel/kernel/Latest/Image.gz
          cp ../out/arch/arm64/boot/Image.gz LawRun-Kernel/kernel/Old/Image.gz
          zip -qr9 ../LawRun_sdm845_installer_test.zip . -x '.git*'
          cd .. && ls -la LawRun_sdm845_installer_test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LawRun-sdm845-installer-test
          path: |
            LawRun_sdm845_installer_test.zip
            build.log
# trigger
